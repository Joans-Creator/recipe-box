<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Box</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8;
    --surface:#FFFFFF;
    --ink:#141412;
    --ink-soft:#6B6A64;
    --ink-faint:#9A9990;
    --line:#E2E0D8;
    --line-strong:#141412;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  .wrap{max-width:840px;margin:0 auto;padding:0 20px;}

  header{padding:40px 0 24px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-style:italic;font-size:34px;letter-spacing:-0.01em;margin:0;}
  .count-tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;}
  .toolbar{display:flex;gap:10px;margin-top:20px;}
  .search-box{position:relative;flex:1;}
  .search-box input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:0 14px 0 38px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s ease;}
  .search-box input:focus{border-color:var(--line-strong);}
  .search-box input::placeholder{color:var(--ink-faint);}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-faint);pointer-events:none;}
  .btn{height:42px;padding:0 18px;border:1px solid var(--line-strong);border-radius:2px;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;letter-spacing:.02em;cursor:pointer;white-space:nowrap;transition:opacity .15s ease, transform .1s ease;}
  .btn:hover{opacity:.82;}
  .btn:active{transform:scale(.98);}
  .btn-text{background:none;border:none;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;padding:8px 4px;}
  .btn-text:hover{color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:30px;}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:border-color .15s ease, transform .1s ease;display:flex;flex-direction:column;}
  .card:hover{border-color:var(--line-strong);}
  .card:active{transform:scale(.99);}
  .card::after{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 16px 16px 0;border-color:transparent var(--paper) transparent transparent;filter:drop-shadow(-1px 1px 0 var(--line));}
  .card-photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-bottom:1px solid var(--line);}
  .card-photo-empty{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:repeating-linear-gradient(45deg, var(--paper), var(--paper) 8px, var(--surface) 8px, var(--surface) 16px);}
  .card-photo-empty svg{width:26px;height:26px;stroke:var(--ink-faint);opacity:.5;}
  .card-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;}
  .card-title{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.25;margin:0 0 6px;}
  .card-meta{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-top:auto;padding-top:8px;}

  .empty{text-align:center;padding:90px 20px 40px;color:var(--ink-soft);}
  .empty svg{width:34px;height:34px;stroke:var(--ink-faint);margin-bottom:16px;}
  .empty h2{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:22px;color:var(--ink);margin:0 0 8px;}
  .empty p{font-size:14px;margin:0 0 20px;}

  .overlay{position:fixed;inset:0;background:rgba(20,20,18,0.5);display:none;align-items:flex-start;justify-content:center;padding:0;z-index:50;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);width:100%;max-width:640px;min-height:100vh;padding:0 0 60px;}
  @media (min-width:680px){
    .overlay{padding:40px 20px;}
    .modal{min-height:auto;border:1px solid var(--line-strong);margin-bottom:40px;}
  }
  .modal-topbar{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;z-index:2;}
  .icon-btn{background:none;border:none;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .icon-btn svg{width:19px;height:19px;stroke:currentColor;}
  .modal-inner{padding:24px 20px 0;}

  .detail-photo{width:100%;max-height:320px;object-fit:cover;display:block;border:1px solid var(--line);margin-bottom:22px;}
  .detail-title{font-family:'Fraunces',serif;font-weight:500;font-size:30px;line-height:1.2;margin:0 0 22px;}
  .section-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .ingredient-list{list-style:none;padding:0;margin:0 0 30px;}
  .ingredient-list li{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer;user-select:none;}
  .ingredient-list li:last-child{border-bottom:none;}
  .check{flex:none;width:16px;height:16px;border:1px solid var(--ink);margin-top:2px;position:relative;}
  .check.checked::after{content:"";position:absolute;left:3px;top:-1px;width:5px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(40deg);}
  .ingredient-list li.checked span{color:var(--ink-faint);text-decoration:line-through;}

  label.field{display:block;margin-bottom:20px;}
  label.field .flabel{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;}
  input[type=text], textarea{width:100%;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:10px 12px;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);outline:none;resize:vertical;transition:border-color .15s ease;}
  input[type=text]:focus, textarea:focus{border-color:var(--line-strong);}
  input[type=text]{height:44px;}
  input#title-input{font-family:'Fraunces',serif;font-size:20px;height:52px;}
  textarea{min-height:150px;line-height:1.7;}
  .photo-input-area{border:1px dashed var(--line);padding:16px;text-align:center;cursor:pointer;position:relative;color:var(--ink-soft);font-size:13px;}
  .photo-input-area:hover{border-color:var(--ink-soft);}
  .photo-input-area img{max-width:100%;max-height:220px;display:block;margin:0 auto 10px;}
  .photo-input-area input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .remove-photo{margin-top:8px;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;padding-top:20px;border-top:1px solid var(--line);}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}
  .warning-banner{background:#141412;color:#FAFAF8;font-size:13px;padding:12px 20px;text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Recipe Box</h1>
      <span class="count-tag" id="count-tag"></span>
    </div>
    <div class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Search recipes or ingredients">
      </div>
      <button class="btn" id="new-btn">+ New recipe</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <h2 id="empty-title">Your box is empty</h2>
    <p id="empty-text">Save your first recipe to start building your collection.</p>
    <button class="btn" id="empty-btn">+ New recipe</button>
  </div>
</div>

<div class="overlay" id="detail-overlay">
  <div class="modal">
    <div class="modal-topbar">
      <button class="icon-btn" id="detail-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div style="display:flex;gap:4px;">
        <button class="icon-btn" id="detail-edit" aria-label="Edit">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn" id="detail-delete" aria-label="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-inner">
      <img id="detail-photo" class="detail-photo" style="display:none;">
      <h2 class="detail-title" id="detail-title"></h2>
      <p class="section-label">Ingredients</p>
      <ul class="ingredient-list" id="detail-ingredients"></ul>
    </div>
  </div>
</div>

<div class="overlay" id="form-overlay">
  <div class="modal">
    <div class="modal-topbar">
      <button class="icon-btn" id="form-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <span class="section-label" id="form-heading" style="margin:0;border:none;padding:0;"></span>
      <span style="width:32px;"></span>
    </div>
    <div class="modal-inner">
      <label class="field">
        <span class="flabel">Title</span>
        <input type="text" id="title-input" placeholder="Sunday morning pancakes">
      </label>
      <label class="field">
        <span class="flabel">Photo (optional)</span>
        <div class="photo-input-area" id="photo-area">
          <span id="photo-placeholder-text">Tap to add a photo</span>
          <img id="photo-preview" style="display:none;">
          <input type="file" accept="image/*" id="photo-input">
        </div>
        <button class="remove-photo" id="remove-photo" style="display:none;">Remove photo</button>
      </label>
      <label class="field">
        <span class="flabel">Ingredients</span>
        <textarea id="ingredients-input" placeholder="2 cups flour&#10;1 tsp baking powder&#10;3 large eggs&#10;1 cup milk"></textarea>
        <div class="hint">One ingredient per line.</div>
      </label>
      <div class="form-actions">
        <button class="btn-text" id="form-cancel">Cancel</button>
        <button class="btn" id="form-save">Save recipe</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  let recipes = [];
  let editingId = null;
  let activeId = null;
  let checkedState = {};
  let pendingPhoto = null;
  let photoRemoved = false;

  const grid = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  const countTag = document.getElementById('count-tag');
  const searchInput = document.getElementById('search');

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function api(path, options){
    const res = await fetch('/api' + path, Object.assign({
      headers: {'Content-Type':'application/json'}
    }, options));
    if(!res.ok){
      let msg = 'Something went wrong.';
      try{ const body = await res.json(); if(body.error) msg = body.error; }catch(e){}
      throw new Error(msg);
    }
    if(res.status === 204) return null;
    return res.json();
  }

  async function loadRecipes(){
    try{
      recipes = await api('/recipes');
    }catch(e){
      console.error(e);
      const banner = document.createElement('div');
      banner.className = 'warning-banner';
      banner.textContent = "Couldn't reach the server. Make sure Recipe Box is running and try reloading.";
      document.body.prepend(banner);
      recipes = [];
    }
    render();
  }

  function render(){
    const q = searchInput.value.trim().toLowerCase();
    let list = recipes.slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
    if(q){
      list = list.filter(r =>
        r.title.toLowerCase().includes(q) ||
        r.ingredients.some(i => i.toLowerCase().includes(q))
      );
    }

    countTag.textContent = recipes.length === 1 ? '1 recipe' : recipes.length + ' recipes';

    if(recipes.length === 0){
      grid.style.display = 'none';
      emptyEl.style.display = 'block';
      document.getElementById('empty-title').textContent = 'Your box is empty';
      document.getElementById('empty-text').textContent = 'Save your first recipe to start building your collection.';
      document.getElementById('empty-btn').style.display = 'inline-block';
      return;
    }

    if(list.length === 0){
      grid.style.display = 'none';
      emptyEl.style.display = 'block';
      document.getElementById('empty-title').textContent = 'No matches';
      document.getElementById('empty-text').textContent = 'Nothing found for "' + q + '".';
      document.getElementById('empty-btn').style.display = 'none';
      return;
    }

    emptyEl.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = list.map(r => `
      <div class="card" data-id="${r.id}">
        ${r.photo
          ? `<img class="card-photo" src="${r.photo}" alt="">`
          : `<div class="card-photo-empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>`
        }
        <div class="card-body">
          <h3 class="card-title">${escapeHtml(r.title)}</h3>
          <div class="card-meta">${r.ingredients.length} ingredient${r.ingredients.length===1?'':'s'}</div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('click', ()=> openDetail(card.dataset.id));
    });
  }

  const detailOverlay = document.getElementById('detail-overlay');
  function openDetail(id){
    const r = recipes.find(x=>x.id===id);
    if(!r) return;
    activeId = id;
    if(!checkedState[id]) checkedState[id] = new Set();

    document.getElementById('detail-title').textContent = r.title;
    const photoEl = document.getElementById('detail-photo');
    if(r.photo){ photoEl.src = r.photo; photoEl.style.display='block'; }
    else{ photoEl.style.display='none'; }

    const list = document.getElementById('detail-ingredients');
    list.innerHTML = r.ingredients.map((ing,i)=>`
      <li data-i="${i}" class="${checkedState[id].has(i)?'checked':''}">
        <span class="check ${checkedState[id].has(i)?'checked':''}"></span>
        <span>${escapeHtml(ing)}</span>
      </li>`).join('');
    list.querySelectorAll('li').forEach(li=>{
      li.addEventListener('click', ()=>{
        const i = parseInt(li.dataset.i,10);
        if(checkedState[id].has(i)) checkedState[id].delete(i);
        else checkedState[id].add(i);
        li.classList.toggle('checked');
        li.querySelector('.check').classList.toggle('checked');
      });
    });

    detailOverlay.classList.add('open');
  }
  document.getElementById('detail-close').addEventListener('click', ()=> detailOverlay.classList.remove('open'));
  detailOverlay.addEventListener('click', e=>{ if(e.target===detailOverlay) detailOverlay.classList.remove('open'); });

  document.getElementById('detail-delete').addEventListener('click', async ()=>{
    if(!activeId) return;
    if(!confirm('Delete this recipe? This cannot be undone.')) return;
    try{
      await api('/recipes/' + activeId, { method:'DELETE' });
      recipes = recipes.filter(r=>r.id!==activeId);
      detailOverlay.classList.remove('open');
      render();
    }catch(e){
      alert(e.message);
    }
  });

  document.getElementById('detail-edit').addEventListener('click', ()=>{
    if(!activeId) return;
    detailOverlay.classList.remove('open');
    openForm(activeId);
  });

  const formOverlay = document.getElementById('form-overlay');
  const titleInput = document.getElementById('title-input');
  const ingredientsInput = document.getElementById('ingredients-input');
  const photoInput = document.getElementById('photo-input');
  const photoPreview = document.getElementById('photo-preview');
  const photoPlaceholder = document.getElementById('photo-placeholder-text');
  const removePhotoBtn = document.getElementById('remove-photo');

  function resetForm(){
    titleInput.value = '';
    ingredientsInput.value = '';
    pendingPhoto = null;
    photoRemoved = false;
    photoPreview.style.display = 'none';
    photoPlaceholder.style.display = 'block';
    removePhotoBtn.style.display = 'none';
    photoInput.value = '';
  }

  function openForm(id){
    editingId = id || null;
    resetForm();
    document.getElementById('form-heading').textContent = id ? 'Edit recipe' : 'New recipe';
    if(id){
      const r = recipes.find(x=>x.id===id);
      if(r){
        titleInput.value = r.title;
        ingredientsInput.value = r.ingredients.join('\n');
        if(r.photo){
          pendingPhoto = r.photo;
          photoPreview.src = r.photo;
          photoPreview.style.display = 'block';
          photoPlaceholder.style.display = 'none';
          removePhotoBtn.style.display = 'inline-block';
        }
      }
    }
    formOverlay.classList.add('open');
    setTimeout(()=> titleInput.focus(), 50);
  }
  function closeForm(){ formOverlay.classList.remove('open'); }

  document.getElementById('new-btn').addEventListener('click', ()=> openForm(null));
  document.getElementById('empty-btn').addEventListener('click', ()=> openForm(null));
  document.getElementById('form-close').addEventListener('click', closeForm);
  document.getElementById('form-cancel').addEventListener('click', closeForm);
  formOverlay.addEventListener('click', e=>{ if(e.target===formOverlay) closeForm(); });

  photoInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => { img.src = ev.target.result; };
    img.onload = () => {
      const maxDim = 1000;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.75);
      photoRemoved = false;
      photoPreview.src = pendingPhoto;
      photoPreview.style.display = 'block';
      photoPlaceholder.style.display = 'none';
      removePhotoBtn.style.display = 'inline-block';
    };
    reader.readAsDataURL(file);
  });

  removePhotoBtn.addEventListener('click', e=>{
    e.preventDefault();
    pendingPhoto = null;
    photoRemoved = true;
    photoInput.value = '';
    photoPreview.style.display = 'none';
    photoPlaceholder.style.display = 'block';
    removePhotoBtn.style.display = 'none';
  });

  document.getElementById('form-save').addEventListener('click', async ()=>{
    const title = titleInput.value.trim();
    const ingredients = ingredientsInput.value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!title){ titleInput.focus(); return; }
    const photo = photoRemoved ? null : pendingPhoto;

    try{
      if(editingId){
        const updated = await api('/recipes/' + editingId, {
          method:'PUT',
          body: JSON.stringify({ title, ingredients, photo: photoRemoved ? null : (pendingPhoto || undefined) })
        });
        const idx = recipes.findIndex(r=>r.id===editingId);
        recipes[idx] = updated;
      }else{
        const created = await api('/recipes', {
          method:'POST',
          body: JSON.stringify({ title, ingredients, photo })
        });
        recipes.push(created);
      }
      closeForm();
      render();
    }catch(e){
      alert(e.message);
    }
  });

  searchInput.addEventListener('input', render);

  loadRecipes();
})();
</script>
</body>
</html>
